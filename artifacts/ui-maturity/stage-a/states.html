<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mai · 阶段 A 状态设计</title>
<style>
:root{color-scheme:light;--bg:#f0efed;--paper:#faf9f7;--card:#fff;--ink:#292733;--muted:#625f6f;--line:#e6e2e8;--accent:#70578e;--on:#fff;--error:#a13548;--tint:#eee9f2}
:root[data-theme=dark]{color-scheme:dark;--bg:#1b191f;--paper:#211f25;--card:#2a2730;--ink:#f3eff7;--muted:#c8c1d2;--line:#4d4659;--accent:#c8b4e8;--on:#292333;--error:#f29bad;--tint:#3b3345}
*{box-sizing:border-box}body{margin:0;font:15px/1.7 'Segoe UI','Microsoft YaHei',sans-serif;color:var(--ink);background:var(--bg)}button,select,textarea{font:inherit;color:inherit}button,select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button:disabled{opacity:.6;cursor:wait}.primary{background:var(--accent);color:var(--on);border-color:transparent}header{max-width:1180px;margin:auto;padding:24px}h1{font-size:25px;margin:0}header p{color:var(--muted);margin:6px 0 18px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.layout{max-width:1180px;margin:0 auto 36px;display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;padding:0 24px}nav{display:grid;gap:5px;align-content:start}nav button{text-align:left;background:transparent;border-color:transparent}nav button[aria-current]{background:var(--tint);font-weight:600}.screen{min-height:440px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:30px;display:flex;flex-direction:column;gap:22px}.screen h2{font-size:20px;margin:0}.tag{color:var(--muted);font-size:12px}.conversation{flex:1;display:grid;align-content:start;gap:20px}.user{background:var(--tint);border-radius:12px 12px 3px 12px;padding:12px 18px;justify-self:end;max-width:90%}.assistant{padding:0 8px;max-width:90%}.status{border-left:3px solid var(--accent);padding:10px 14px;background:var(--card)}.error{border-color:var(--error)}.status p{margin:0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.composer{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 16px}.composer span{flex:1;color:var(--muted)}.field{display:grid;gap:8px}.field textarea{width:100%;resize:vertical;min-height:100px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:8px}.note{margin:16px 0;color:var(--muted);font-size:13px}#interaction{min-height:28px;color:var(--accent)}.spec{border-top:1px solid var(--line);padding-top:15px;color:var(--muted)}@media(max-width:780px){header{padding:18px}.layout{grid-template-columns:1fr;padding:0 18px;gap:14px}nav{display:flex;overflow:auto}nav button{white-space:nowrap}.screen{padding:20px;min-height:460px}.composer{flex-wrap:wrap}}
</style></head><body><header><div class="tag">MAI / UI MATURITY / STAGE A</div><h1>每一种状态，都有清楚的下一步</h1><p>交互设计稿 · 示例数据 · 不连接模型、不保存设置。以下为拟实现表现，不代表正式程序已经具备。</p><div class="toolbar"><label>主题 <select id="theme"><option value="light">浅色</option><option value="dark">深色</option></select></label><span class="tag">缩小窗口可检查窄布局；左侧选择场景。</span></div></header><main class="layout"><nav aria-label="状态场景" id="scenes"></nav><section><div class="screen" id="screen"></div><div id="interaction" role="status"></div><div class="spec" id="spec"></div></section></main>
<script>
const scenes=[
['connect','首次连接','开始第一段对话','先连接模型。对话保存在本机，回复所需上下文会发送至所选服务。','连接模型','configure','保留现有连接入口，不增加强制注册；配置与日常聊天分离。'],
['waiting','等待回复','正在等待回应','请求进行中，你可以随时停止。','停止','cancelling','沿用 Coordinator 的 busy 状态；等待文案不能假装已收到流式内容。'],
['cancelling','取消中','正在停止本次回复','取消结果确认前，请稍候。','取消中…','disabled','只投影 Runtime 的取消中状态；不能立即显示已停止或同时开启新请求。'],
['cancelled','已取消','本次回复已停止','你可以编辑后重新发送。此提示只说明运行终态，不宣称消息已经保存或删除。','编辑后重发','edit','拟补充明确终态反馈。草稿恢复仅在输入框没有新草稿时进行；保留现有消息持久化规则。'],
['failed','请求失败','暂时没能取得回复','请检查网络后重试；如果连接配置有变化，可前往模型设置。','编辑后重试','edit','不自动重发。错误类别由可验证的结果决定，无法分类时使用中性描述。现有输入不得被覆盖。'],
['partial','部分回复中断','回复未完成','这段内容尚不完整。请勿将它作为最终答复。','编辑后重试','edit','仅当运行时确实交付了部分内容时显示；当前普通文字 Chat 未验证流式呈现，禁止新增虚假的部分回复。'],
['saving','保存中','正在保存设置','此方案暂时锁定普通设置字段，完成后恢复编辑。','正在保存…','disabled','建议以统一提交锁保护所有会保存普通配置的操作；不扩大到头像、壁纸等独立操作。若采用草稿版本合并方案，需另写并发语义。'],
['save-failed','保存失败','设置未保存','输入仍保留在当前窗口。请稍后重试或查看诊断。','重试保存','saved','不清空字段，不把外观预览当成保存成功；真实 Main 落盘失败须继续回滚。'],
['saved','保存成功','设置已保存','普通设置已更新。','完成','done','只在 Main 返回保存成功后显示；页面继续编辑时应重新显示未保存提示。'],
['empty','空列表','还没有日程','添加一件想做的事，让麻衣陪你一起记住。','添加日程','add','只连接已有可用的新增入口；示例空状态不填入假日程。']];
let selected='connect';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(id){selected=id;const item=scenes.find(s=>s[0]===id);const [,label,title,detail,action,target,spec]=item;
document.querySelectorAll('[data-scene]').forEach(b=>{b.toggleAttribute('aria-current',b.dataset.scene===id)});
const setting=['saving','save-failed','saved'].includes(id), chat=['waiting','cancelling','cancelled','failed','partial'].includes(id);
document.getElementById('screen').innerHTML=`<div class="tag">${setting?'设置 / 陪伴偏好':chat?'陪伴 / 新对话':'Mai'}</div><h2>${esc(title)}</h2><div class="conversation">${setting?`<label class="field">自定义性格补充<textarea ${id==='saving'?'disabled':''}>回答时简短一点。</textarea></label>`:chat?'<div class="user">今天有一点累，陪我聊一会儿吧。</div>':''}${id==='partial'?'<div class="assistant">辛苦了，可以先让自己休息一下……</div>':''}<div class="status ${['failed','save-failed','partial'].includes(id)?'error':''}"><p>${esc(detail)}</p><div class="actions"><button class="primary" id="primary" ${target==='disabled'?'disabled':''}>${action}</button>${['failed','save-failed','partial'].includes(id)?'<button id="diagnostics">查看诊断</button>':''}</div></div></div>${chat?'<div class="composer"><span>想和麻衣聊些什么？</span><button disabled>发送</button></div>':''}`;
document.getElementById('spec').textContent='执行约束：'+spec;document.getElementById('interaction').textContent='';
document.getElementById('primary').onclick=()=>{if(['cancelling','saved'].includes(target))show(target);else document.getElementById('interaction').textContent={configure:'设计演示：进入现有模型设置分类。',edit:'设计演示：聚焦编辑区；由用户明确重新发送。',done:'设计演示：返回当前页面。',add:'设计演示：打开现有日程新增入口。'}[target]||''};
document.getElementById('diagnostics')?.addEventListener('click',()=>document.getElementById('interaction').textContent='设计演示：打开现有脱敏诊断入口，不显示原始回复或密钥。');}
for(const [id,label] of scenes){const b=document.createElement('button');b.textContent=label;b.dataset.scene=id;b.onclick=()=>show(id);document.getElementById('scenes').append(b)}
document.getElementById('theme').onchange=e=>document.documentElement.dataset.theme=e.target.value;show(selected);
</script></body></html>
